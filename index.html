
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> المساعد الآلي الذكي  |  Smart Automated Assistant </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f3f6fb;
      color: #172033;
      min-height: 100vh;
    }

    button, input { font-family: inherit; }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      min-height: 100vh;
      padding: 25px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome, .chat {
      background: white;
      border-radius: 22px;
      padding: 30px 22px;
      box-shadow: 0 8px 35px rgba(0,0,0,.07);
    }

    .welcome { text-align: center; }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 23px;
      margin: 5px 0;
    }

    .english-title {
      font-size: 20px;
      color: #475569;
      direction: ltr;
      margin: 5px 0;
    }

    .subtitle {
      color: #64748b;
      margin: 8px 0 25px;
    }

    .language-question {
      font-size: 17px;
      font-weight: 700;
      margin: 25px 0 18px;
    }

    .language-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .language-buttons button {
      flex: 1;
      min-width: 130px;
      padding: 14px;
      border: 1px solid #dbe3ef;
      background: #f8fafc;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-buttons button:hover {
      background: #eaf1ff;
      border-color: #3569df;
    }

    .chat {
      display: none;
      padding: 0;
      overflow: hidden;
    }

    .chat-header {
      background: #2458c6;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .chat-header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    .messages {
      height: 390px;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 11px 14px;
      border-radius: 13px;
      max-width: 85%;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot {
      background: #eef2f8;
      align-self: flex-start;
    }

    .user {
      background: #2458c6;
      color: white;
      align-self: flex-end;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #edf0f5;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      background: #2458c6;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .input-area button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back-button {
      border: none;
      background: transparent;
      color: #2458c6;
      padding: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="container">

    <section class="welcome" id="welcome">
      <div class="logo">🤖</div>

      <h1> المساعد الآلي الذكي </h1>
      <h2 class="english-title"> Smart Automated Assistant </h2>

      <p class="subtitle">
        نسعد بخدمتكم<br>
        We're happy to help you
      </p>

      <div class="language-question">
        يرجى اختيار لغة المحادثة<br>
        Please select your conversation language
      </div>

      <div class="language-buttons">
        <button onclick="selectLanguage('ar')">🇸🇦 العربية</button>
        <button onclick="selectLanguage('en')">🇬🇧 English</button>
      </div>
    </section>

    <section class="chat" id="chat">
      <header class="chat-header">
        <h2 id="chatTitle">🤖 المساعد الآلي الذكي 🤖</h2>
        <p id="chatSubtitle">نحن هنا لمساعدتك</p>
      </header>

      <div class="messages" id="messages"></div>

      <form class="input-area" id="chatForm">
        <input
          id="messageInput"
          type="text"
          placeholder="اكتب رسالتك هنا..."
          autocomplete="off"
          required
        >
        <button id="sendButton" type="submit">إرسال</button>
      </form>

      <button class="back-button" onclick="backToLanguage()">
        <span id="backText">تغيير اللغة</span>
      </button>
    </section>

  </main>

  <script>
    let currentLanguage = 'ar';

    const translations = {
      ar: {
        title: '🤖 المساعد الآلي الذكي 🤖',
        subtitle: 'نحن هنا لمساعدتك',
        placeholder: 'اكتب رسالتك هنا...',
        send: 'إرسال',
        back: 'تغيير اللغة',
        welcome: 'مرحباً بك! كيف يمكنني مساعدتك اليوم؟',
        loading: 'جاري كتابة الرد...',
        error: 'عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.'
      },

      en: {
        title: '🤖 Smart Automated Assistant 🤖',
        subtitle: 'We are here to help you',
        placeholder: 'Type your message here...',
        send: 'Send',
        back: 'Change language',
        welcome: 'Welcome! How can I help you today?',
        loading: 'Writing a reply...',
        error: 'Sorry, an error occurred. Please try again.'
      }
    };

    function selectLanguage(language) {
      currentLanguage = language;

      document.getElementById('welcome').hidden = true;
      document.getElementById('chat').style.display = 'block';

      document.documentElement.lang = language;
      document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';

      const t = translations[language];

      document.getElementById('chatTitle').textContent = t.title;
      document.getElementById('chatSubtitle').textContent = t.subtitle;
      document.getElementById('messageInput').placeholder = t.placeholder;
      document.getElementById('sendButton').textContent = t.send;
      document.getElementById('backText').textContent = t.back;

      document.getElementById('messages').innerHTML = '';
      addMessage(t.welcome, 'bot');
    }

    function backToLanguage() {
      document.getElementById('chat').style.display = 'none';
      document.getElementById('welcome').hidden = false;
    }

    function addMessage(text, type) {
      const message = document.createElement('div');
      message.className = 'message ' + type;
      message.textContent = text;

      const messages = document.getElementById('messages');
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    document.getElementById('chatForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const input = document.getElementById('messageInput');
      const button = document.getElementById('sendButton');
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      button.disabled = true;

      const t = translations[currentLanguage];
      const loadingMessage = addMessage(t.loading, 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: text,
            language: currentLanguage
          })
        });

        if (!response.ok) throw new Error('Server error');

        const data = await response.json();
        loadingMessage.textContent = data.reply || data.response || t.error;

      } catch (error) {
        loadingMessage.textContent = t.error;
        console.error(error);
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
