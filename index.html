<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🤖 المساعد الذكي الالي 🤖</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 15px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f2f5f4;
  font-family: Arial, sans-serif;
}
.chat {
  width: 100%;
  max-width: 460px;
  height: 88vh;
  min-height: 420px;
  background: white;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 5px 25px #0002;
}
header {
  background: #176b52;
  color: white;
  padding: 20px;
}
header h2 { margin: 0 0 6px; }
header p { margin: 0; font-size: 13px; }
#languageScreen {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 18px;
  padding: 20px;
  text-align: center;
}
.languages {
  display: flex;
  width: 100%;
  gap: 12px;
}
.languages button {
  flex: 1;
  padding: 20px 8px;
  border: 1px solid #ddd;
  border-radius: 14px;
  background: #f8faf9;
  color: #222;
  font-size: 17px;
  cursor: pointer;
}
.languages button:active { background: #e2f1eb; }
.flag { display: block; font-size: 30px; margin-bottom: 8px; }
#chatScreen {
  flex: 1;
  min-height: 0;
  display: none;
  flex-direction: column;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 85%;
  padding: 12px;
  border-radius: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.bot { background: #edf2f0; align-self: flex-start; }
.user { background: #176b52; color: white; align-self: flex-end; }
form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
}
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
form button, #changeLanguage {
  background: #176b52;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
}
#changeLanguage {
  margin: 10px;
  align-self: flex-start;
  background: #e8f1ed;
  color: #176b52;
}
button:disabled { opacity: .5; }
</style>
</head>
<body>
<main class="chat">
  <header>
    <h2 id="title">مساعد المتجر الذكي 🤖</h2>
    <p id="subtitle">نسعد بخدمتكم</p>
  </header>

  <section id="languageScreen">
    <h3 id="chooseTitle">يرجى اختيار لغة المحادثة</h3>
    <div class="languages">
      <button onclick="chooseLanguage('ar')">
        <span class="flag">🇸🇦</span>
        العربية
      </button>
      <button onclick="chooseLanguage('en')">
        <span class="flag">🇬🇧</span>
        English
      </button>
    </div>
  </section>

  <section id="chatScreen">
    <button id="changeLanguage" onclick="showLanguages()">
      تغيير اللغة
    </button>
    <div id="messages"></div>
    <form id="chatForm">
      <input id="question" required autocomplete="off"
        placeholder="اكتب سؤالك هنا...">
      <button id="send" type="submit">إرسال</button>
    </form>
  </section>
</main>

<script>
let language = "ar";

const translations = {
  ar: {
    title: "مساعد المتجر الذكي 🤖",
    subtitle: "نسعد بخدمتكم",
    choose: "يرجى اختيار لغة المحادثة",
    change: "تغيير اللغة",
    placeholder: "اكتب سؤالك هنا...",
    send: "إرسال",
    welcome: "أهلاً بك! 👋 كيف يمكنني مساعدتك اليوم؟",
    error: "تعذر الاتصال بالخدمة. يرجى المحاولة لاحقاً.",
    direction: "rtl"
  },
  en: {
    title: "Smart Store Assistant 🤖",
    subtitle: "We are happy to help you",
    choose: "Please select your language",
    change: "Change language",
    placeholder: "Type your question...",
    send: "Send",
    welcome: "Welcome! 👋 How can I help you today?",
    error: "Unable to connect. Please try again later.",
    direction: "ltr"
  }
};

function chooseLanguage(lang) {
  language = lang;
  const t = translations[lang];

  document.documentElement.lang = lang;
  document.documentElement.dir = t.direction;
  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("changeLanguage").textContent = t.change;
  document.getElementById("question").placeholder = t.placeholder;
  document.getElementById("send").textContent = t.send;

  document.getElementById("languageScreen").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";

  document.getElementById("messages").innerHTML = "";
  addMessage(t.welcome, "bot");
  document.getElementById("question").focus();
}

function showLanguages() {
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("languageScreen").style.display = "flex";
}

function addMessage(text, type) {
  const item = document.createElement("div");
  item.className = "msg " + type;
  item.textContent = text;
  const messages = document.getElementById("messages");
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("chatForm").addEventListener("submit",
async function(event) {
  event.preventDefault();

  const input = document.getElementById("question");
  const send = document.getElementById("send");
  const question = input.value.trim();

  if (!question) return;

  addMessage(question, "user");
  input.value = "";
  send.disabled = true;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: question,
        language: language
      })
    });

    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();
    addMessage(data.reply || translations[language].error, "bot");
  } catch (error) {
    addMessage(translations[language].error, "bot");
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
